/**:
  ros__parameters:
    world_name: "default"
    chassis_controller:
      # 启动时保持出生朝向；仅在收到 FOLLOW_GIMBAL 指令后进入跟随模式。
      follow_yaw: false
      follow_yaw_pid:
        p: 5.0
        i: 0.0
        d: 1.0
        imin: -1.0
        imax: 1.0
        cmdmin: -1000.0
        cmdmax: 1000.0
    gimbal_controller:
      pitch_pid:
        p: 10.0
        i: 0.1
        d: 1.0
        imin: -1.0
        imax: 1.0
        cmdmin: -1000.0
        cmdmax: 1000.0
      yaw_pid:
        p: 10.0
        i: 0.0
        d: 1.0
        imin: -0.2
        imax: 0.2
        cmdmin: -1000.0
        cmdmax: 1000.0
